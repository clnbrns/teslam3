# Fly.io deployment config — single shared-cpu-1x VM in DFW.
# Bootstrap:
#   fly launch --no-deploy --copy-config
#   fly volumes create tesla_data --size 1 --region dfw
#   fly secrets set \
#     TESLA_CLIENT_ID=$(grep TESLA_CLIENT_ID .env | cut -d= -f2) \
#     TESLA_CLIENT_SECRET=$(grep TESLA_CLIENT_SECRET .env | cut -d= -f2) \
#     TESLA_REDIRECT_URI=https://tesla.burnsbuilt.co/callback \
#     TESLA_PUBLIC_HOSTNAME=tesla.burnsbuilt.co \
#     TESLA_PRIVATE_KEY="$(cat secrets/tesla_private.pem)"
#   fly certs add tesla.burnsbuilt.co
#   fly deploy
# Then in your DNS provider:
#   CNAME tesla.burnsbuilt.co → <app>.fly.dev

app = "burnsbuilt-tesla"
primary_region = "dfw"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "tesla_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
