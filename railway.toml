[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'mkdir -p /data && uvicorn tesla_fleet.api:app --host 0.0.0.0 --port ${PORT:-8080}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/api/roi"
healthcheckTimeout = 30

# Persistent volume for SQLite + token store.
# Mounted at /data — see TESLA_DB_PATH and TOKEN_STORE_PATH in Dockerfile.
[[deploy.volumes]]
mountPath = "/data"
name = "tesla_data"
