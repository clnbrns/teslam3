[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'mkdir -p /data && exec uvicorn tesla_fleet.api:app --host 0.0.0.0 --port ${PORT:-8080} --workers 1 --no-access-log --limit-max-requests 5000'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/healthz"
healthcheckTimeout = 30

# Persistent volume for SQLite + token store.
# Mounted at /data — see TESLA_DB_PATH and TOKEN_STORE_PATH in Dockerfile.
[[deploy.volumes]]
mountPath = "/data"
name = "tesla_data"
