<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Goblin M3P · Trips</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="/static/dashboard.css?v=20260507-124855" />
<style>
  .trip {
    display: grid;
    grid-template-columns: 200px 1fr 80px 90px 80px 90px;
    gap: 14px; align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--matte-green-line);
    font-size: 13px; cursor: pointer;
    color: var(--text);
  }
  .trip:hover { background: rgba(47, 82, 64, 0.12); }
  .trip:focus-visible { outline: 2px solid var(--matte-green-soft); outline-offset: -2px; }
  .trip.seg { border-left: 2px solid var(--matte-green-soft); padding-left: 14px; }
  .trip.seg .driver { color: var(--text-dim); font-style: italic; }
  .trip .when .day { color: var(--text); }
  .trip .when .time { color: var(--text-dim); font-size: 11px; }
  .trip .driver { color: var(--text); font-weight: 500; }
  .trip .driver.colin { color: #4a90d9; }
  .trip .driver.lindsey { color: #c9a227; }
  .trip .driver.carson { color: var(--caliper-red); }
  .trip .num { text-align: right; font-variant-numeric: tabular-nums; }
  .trip .mi { color: var(--text); }
  .trip .speed { color: var(--text-dim); font-size: 12px; }
  .trip .cost { color: var(--matte-green-soft); font-weight: 600; }
  .trip .events { font-size: 11px; color: var(--text-dim); text-align: right; }
  .trip .events .b { color: var(--caliper-red); }
  .trip .events .a { color: #d97a3d; }
  .trip-header {
    display: grid; grid-template-columns: 200px 1fr 80px 90px 80px 90px;
    gap: 14px; padding: 10px 16px;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--text-dim); border-bottom: 1px solid var(--matte-green-line);
  }
  .trip-header .num { text-align: right; }
</style>
</head>
<body>
  <script src="/static/nav.js?v=20260507-124855" defer></script>
  <script src="/static/mobile.js?v=20260507-124855" defer></script>
  <nav class="nav">
    <a href="/" class="brand" style="text-decoration:none;color:inherit">GOBLIN M3P</a>
    <span class="nav-group">
      <a href="/report">Driver</a>
      <span class="nav-menu">
        <a href="/report?driver=Colin">Colin</a>
        <a href="/report?driver=Lindsey">Lindsey</a>
        <a href="/report?driver=Carson">Carson</a>
      </span>
    </span>
    <a href="/fsd">FSD</a>
    <a href="/attention">Attention</a>
    <a href="/charging">Charging</a>
    <a href="/trips" class="active">Trips</a>
    <a href="/map">Map</a>
    <a href="/roi">ROI</a>
    <a href="/events">Events</a>
    <div class="spacer"></div>
    <span class="status-dot online" id="cpm">—</span>
  </nav>

  <main class="page">
    <div class="page-head">
      <div>
        <div class="eyebrow">Trip Replay · Cost Per Trip</div>
        <h1>Trips</h1>
        <div class="sub" id="sub">—</div>
      </div>
      <div class="filters">
        <select id="driver-filter">
          <option value="">All drivers</option>
          <option>Colin</option>
          <option>Carson</option>
          <option>Lindsey</option>
        </select>
        <button id="reload" class="btn ghost">Refresh</button>
      </div>
    </div>

    <section class="card col-12" style="padding:0">
      <div class="trip-header">
        <span>When</span>
        <span>Driver</span>
        <span class="num">Miles</span>
        <span class="num">Avg / Max</span>
        <span class="num">Cost</span>
        <span class="num">Events</span>
      </div>
      <div id="trips"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const fmt = (n, d=0) => (n == null) ? "—" :
      Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });

    function fmtTs(ts) {
      const d = new Date(ts * 1000);
      return {
        day: d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' }),
        time: d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' }),
      };
    }

    function row(t) {
      const w = fmtTs(t.start_ts);
      const dCls = (t.driver || "").toLowerCase();
      const isSeg = t.kind === "segment";
      const speedCol = isSeg
        ? `<span class="muted">avg ${fmt(t.avg_speed_mph,0)} mph</span>`
        : `${fmt(t.avg_speed_mph,0)} / ${fmt(t.max_speed_mph,0)} mph`;
      const eventsCol = isSeg
        ? `<span class="muted" title="Synthesized from ${t.source}; per-second telemetry not captured">${t.source || "estimated"}</span>`
        : (t.hard_brakes || t.rapid_accels)
          ? `${t.hard_brakes ? `<span class="b">⤓${t.hard_brakes}</span>` : ""}${t.rapid_accels ? `<span class="a">⤒${t.rapid_accels}</span>` : ""}`
          : '<span class="muted">clean</span>';
      const tripUrl = `/trip?start=${Math.floor(t.start_ts)}`;
      return `<a href="${tripUrl}" class="trip ${isSeg ? 'seg' : ''}" style="text-decoration:none">
        <div class="when"><div class="day">${w.day}</div><div class="time">${w.time} · ${fmt(t.duration_minutes,0)} min</div></div>
        <div class="driver ${dCls}">${t.driver}</div>
        <div class="num mi">${fmt(t.miles_est,1)}</div>
        <div class="num speed">${speedCol}</div>
        <div class="num cost">$${fmt(t.cost_usd,2)}</div>
        <div class="events">${eventsCol}</div>
      </a>`;
    }

    async function load() {
      const driver = $("driver-filter").value;
      const url = "/api/trips?limit=200" + (driver ? `&driver=${driver}` : "");
      const r = await fetch(url); const d = await r.json();
      $("trips").innerHTML = d.trips.length
        ? d.trips.map(row).join("")
        : '<div class="empty">No trips detected.</div>';
      $("sub").textContent = `${d.count} trips detected · est. cost $${d.cost_per_mile?.toFixed(3) ?? "—"} / mile`;
      $("cpm").textContent = `${d.count} trips`;
    }

    window.refresh = (typeof load === "function") ? load : null;

    document.addEventListener("DOMContentLoaded", () => {
      $("reload").addEventListener("click", load);
      $("driver-filter").addEventListener("change", load);
      load(); setInterval(load, 60_000);
    });
  </script>
</body>
</html>
